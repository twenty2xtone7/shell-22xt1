# Caelestia fork — upstream shell with caelestia-fork-wip's features integrated at
# source level, plus its own build of the C++ plugin.
#
# Design notes:
#  * Only the QML shell is deployed. Hyprland/fish/foot configs are deliberately
#    NOT here: this fork changes the shell, and overwriting a live ~/.config/hypr
#    from a snapshot would clobber hand-tuned configs.
#  * The C++ plugin is built from this tree and installed INTO the config dir
#    (`<config>/quickshell/caelestia/Caelestia/...`). Quickshell adds the config
#    directory to the QML import path, so `import Caelestia.Services` resolves with
#    no system-wide install and no QML_IMPORT_PATH. The `etc` tree that
#    `cmake --install` also drops there is removed by the hook.
packages = []

# NOTE: deliberately empty. `caelestia install` would otherwise resolve
# "quickshell-git" to whatever provides it (e.g. noctalia-qs) and swap the user's
# shell out, and the package step needs root. Required packages are documented in
# README.md instead; this installer only deploys the shell.

post_install = [
    'cmake -S "$CAELESTIA_DOTS" -B "$CAELESTIA_DOTS/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DINSTALL_QMLDIR=.',
    'ninja -j 3 -C "$CAELESTIA_DOTS/build"',
    'rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"',
    'cmake --install "$CAELESTIA_DOTS/build" --prefix "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"',
    'rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"/etc "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"/lib',
    'sed -i "s|__CAELESTIA_QML_IMPORT__|${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml|g" "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/caelestia/shell.qml"',
]

post_update = [
    'cmake -S "$CAELESTIA_DOTS" -B "$CAELESTIA_DOTS/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DINSTALL_QMLDIR=.',
    'ninja -j 3 -C "$CAELESTIA_DOTS/build"',
    'rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"',
    'cmake --install "$CAELESTIA_DOTS/build" --prefix "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"',
    'rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"/etc "${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml"/lib',
    'sed -i "s|__CAELESTIA_QML_IMPORT__|${XDG_DATA_HOME:-$HOME/.local/share}/caelestia/qml|g" "${XDG_CONFIG_HOME:-$HOME/.config}/quickshell/caelestia/shell.qml"',
    'caelestia shell -k >/dev/null 2>&1 || true',
    'caelestia shell -d >/dev/null 2>&1 || true',
]

[[components]]
name = "shell"
default = true
packages = []

[[components.entries]]
src = "shell.qml"
dest = "$XDG_CONFIG_HOME/quickshell/caelestia/shell.qml"

[[components.entries]]
src = "assets"
dest = "$XDG_CONFIG_HOME/quickshell/caelestia/assets"

[[components.entries]]
src = "components"
dest = "$XDG_CONFIG_HOME/quickshell/caelestia/components"

[[components.entries]]
src = "daemons"
dest = "$XDG_CONFIG_HOME/quickshell/caelestia/daemons"

[[components.entries]]
src = "modules"
dest = "$XDG_CONFIG_HOME/quickshell/caelestia/modules"

[[components.entries]]
src = "services"
dest = "$XDG_CONFIG_HOME/quickshell/caelestia/services"

[[components.entries]]
src = "utils"
dest = "$XDG_CONFIG_HOME/quickshell/caelestia/utils"
